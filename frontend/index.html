<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8faff" />
    <meta name="description" content="Ask questions about your documents with DocChat." />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('docchat_theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'dark' || saved === 'light' ? saved : (systemDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101722' : '#f8faff';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>DocChat — AI document assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
